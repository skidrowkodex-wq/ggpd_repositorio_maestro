<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad2)" rx="16"/>
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Top Header Banner -->
  <rect x="30" y="22" width="1140" height="75" fill="#020617" rx="10" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="52" fill="#f43f5e" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="bold" letter-spacing="1.2">MATRIZ DE DESCONEXIÓN Y FRAGMENTACIÓN DE PROCESOS (ISLAS OPERATIVAS)</text>
  <text x="55" y="78" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5">ANÁLISIS DE QUIEBRES DE FLUJO, SOLAPAMIENTOS Y CANALES INFORMALES EN CORPOELEC DISTRIBUCIÓN</text>

  <!-- Table Header -->
  <rect x="30" y="110" width="260" height="36" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="160" y="133" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PROCESO ORIGEN</text>

  <rect x="298" y="110" width="260" height="36" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="428" y="133" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PROCESO DESTINO</text>

  <rect x="566" y="110" width="180" height="36" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="656" y="133" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ESTADO DE CONEXIÓN</text>

  <rect x="754" y="110" width="416" height="36" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="962" y="133" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CONSECUENCIA OPERATIVA / IMPACTO</text>

  <!-- Row 1: 1x10 -> TRX -->
  <g transform="translate(30, 155)" filter="url(#shadow2)">
    <rect width="1140" height="92" fill="#1e293b" rx="8" stroke="#e11d48" stroke-width="1.2" fill-opacity="0.7"/>
    <!-- Origen -->
    <text x="15" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Atención 1x10 del Buen Gobierno</text>
    <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Luminarias y Transformadores</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Aprobación por WhatsApp / Salas</text>
    <!-- Destino -->
    <text x="280" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Gestión de Activos y Redes</text>
    <text x="280" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Registro físico de Subestaciones</text>
    <text x="280" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Carga y Balance de Circuitos</text>
    <!-- Badge -->
    <rect x="545" y="28" width="160" height="34" fill="#881337" rx="6" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="562" cy="45" r="5" fill="#f43f5e"/>
    <text x="630" y="49" fill="#fecdd3" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">DESCONECTADO</text>
    <!-- Consecuencia -->
    <text x="735" y="28" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">Pérdida de Trazabilidad Técnica (ISO 55000):</text>
    <text x="735" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Se instalan transformadores sin registrar serial COVENIN, capacidad,</text>
    <text x="735" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">ni actualizar el diagrama unifilar. El circuito se vuelve una caja negra.</text>
  </g>

  <!-- Row 2: SCTIS -> P&P -->
  <g transform="translate(30, 256)" filter="url(#shadow2)">
    <rect width="1140" height="92" fill="#1e293b" rx="8" stroke="#d97706" stroke-width="1.2" fill-opacity="0.7"/>
    <!-- Origen -->
    <text x="15" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Tiras de Interrupción (SCTIS)</text>
    <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Indicadores 1er Nivel (FMI/TTI)</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Circuitos Más Fallados</text>
    <!-- Destino -->
    <text x="280" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Programación de Pica y Poda</text>
    <text x="280" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Mantenimiento de Corredores MT</text>
    <text x="280" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Cuadrillas Estadales (2do Nivel)</text>
    <!-- Badge -->
    <rect x="545" y="28" width="160" height="34" fill="#78350f" rx="6" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="562" cy="45" r="5" fill="#f59e0b"/>
    <text x="630" y="49" fill="#fef3c7" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">DÉBIL / MANUAL</text>
    <!-- Consecuencia -->
    <text x="735" y="28" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">Desconexión entre Causa y Efecto:</text>
    <text x="735" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Se podan kilómetros en zonas de fácil acceso para inflar el indicador de</text>
    <text x="735" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">2do nivel, mientras los circuitos críticos por ramas siguen disparándose.</text>
  </g>

  <!-- Row 3: RO -> POA -->
  <g transform="translate(30, 357)" filter="url(#shadow2)">
    <rect width="1140" height="92" fill="#1e293b" rx="8" stroke="#2563eb" stroke-width="1.2" fill-opacity="0.7"/>
    <!-- Origen -->
    <text x="15" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Restricciones Operativas (RO)</text>
    <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Aisladores, Seccionadores rotos</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• 24 Excels estadales levantados</text>
    <!-- Destino -->
    <text x="280" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Presupuesto POA y Compras</text>
    <text x="280" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Asignación Techo Bs. / Procura</text>
    <text x="280" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Cartera PRTSEN (821 obras)</text>
    <!-- Badge -->
    <rect x="545" y="28" width="160" height="34" fill="#1e3a8a" rx="6" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="562" cy="45" r="5" fill="#3b82f6"/>
    <text x="630" y="49" fill="#dbeafe" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">PARCIAL / HÍBRIDO</text>
    <!-- Consecuencia -->
    <text x="735" y="28" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">Asincronía Presupuestaria y Procura:</text>
    <text x="735" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Ingeniería levanta necesidades exactas en campo, pero Procura Central</text>
    <text x="735" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">adquiere insumos genéricos sin responder a las urgencias de los circuitos.</text>
  </g>

  <!-- Row 4: SCEIN -> Mantenimiento -->
  <g transform="translate(30, 458)" filter="url(#shadow2)">
    <rect width="1140" height="92" fill="#1e293b" rx="8" stroke="#7c3aed" stroke-width="1.2" fill-opacity="0.7"/>
    <!-- Origen -->
    <text x="15" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Equipos Indisponibles (SCEIN)</text>
    <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Transformadores de Potencia</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Interruptores/Disyuntores dañados</text>
    <!-- Destino -->
    <text x="280" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Mantenimiento Mayor S/E</text>
    <text x="280" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Cuadrillas de Protecciones</text>
    <text x="280" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Transmisión / Distribución</text>
    <!-- Badge -->
    <rect x="545" y="28" width="160" height="34" fill="#4c1d95" rx="6" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="562" cy="45" r="5" fill="#8b5cf6"/>
    <text x="630" y="49" fill="#ede9fe" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">SILO AISLADO</text>
    <!-- Consecuencia -->
    <text x="735" y="28" fill="#c4b5fd" font-family="sans-serif" font-size="11" font-weight="bold">Falta de Órdenes de Trabajo Automáticas:</text>
    <text x="735" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Los activos dañados se registran como estadísticas estáticas sin disparar</text>
    <text x="735" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">órdenes de trabajo correctivas ni alertar el riesgo de contingencia N-1.</text>
  </g>

  <!-- Row 5: Oficios -> SCMTP -->
  <g transform="translate(30, 559)" filter="url(#shadow2)">
    <rect width="1140" height="92" fill="#1e293b" rx="8" stroke="#e11d48" stroke-width="1.2" fill-opacity="0.7"/>
    <!-- Origen -->
    <text x="15" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Correspondencia & Minutas</text>
    <text x="15" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Memorandos de Presidencia</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Minutas de Reunión VC GGPD</text>
    <!-- Destino -->
    <text x="280" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Ejecución y Control de Tareas</text>
    <text x="280" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">• Asignación a Jefes de División</text>
    <text x="280" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">• Cumplimiento de Plazos</text>
    <!-- Badge -->
    <rect x="545" y="28" width="160" height="34" fill="#881337" rx="6" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="562" cy="45" r="5" fill="#f43f5e"/>
    <text x="630" y="49" fill="#fecdd3" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">PÉRDIDA CONTROL</text>
    <!-- Consecuencia -->
    <text x="735" y="28" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">Incumplimiento Administrativo y Retrabajo:</text>
    <text x="735" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Instrucciones se quedan en PDFs archivados; compromisos asumidos en</text>
    <text x="735" y="62" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">reuniones se pierden al no contar con un gestor web de tareas (SCMTP).</text>
  </g>
</svg>