<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad4)" rx="16"/>
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15"/>

  <!-- Top Header Banner -->
  <rect x="30" y="20" width="1140" height="75" fill="#020617" rx="10" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="48" fill="#10b981" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="bold" letter-spacing="1.2">CORRESPONDENCIA: PATOLOGÍA EN REPO_GGC vs SOLUCIÓN EN REPOSITORIO MAESTRO</text>
  <text x="55" y="74" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5">ERRADICACIÓN DEFINITIVA DEL RETRABAJO MEDIANTE EL ECOSISTEMA INSFORGE POSTGRESQL &amp; APPS REFACTORIZADAS</text>

  <!-- Headers -->
  <rect x="30" y="105" width="280" height="32" fill="#1e293b" rx="6"/>
  <text x="170" y="126" fill="#fda4af" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">INSTRUMENTO / CARPETA GGC</text>

  <rect x="318" y="105" width="380" height="32" fill="#1e293b" rx="6"/>
  <text x="508" y="126" fill="#fcd34d" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">PATOLOGÍA DETECTADA (CAUSA DE RETRABAJO)</text>

  <rect x="706" y="105" width="464" height="32" fill="#1e293b" rx="6"/>
  <text x="938" y="126" fill="#6ee7b7" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">SOLUCIÓN MAESTRA (INSFORGE + VIBEHOST)</text>

  <!-- Row 1: SCTIS -->
  <g transform="translate(30, 145)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">007 INDICADORES 1ER NIVEL</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Tiras de Interrupción + RIND V5.xlsm</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Transcripción manual y 60 días de atraso:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Fórmulas macro propensas a corrupción y datos desfasados.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SCTIS-REF (Puerto 3002 / InsForge sctis.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Ingesta digital, homologación por alias y cálculo instantáneo TTI/FMI/NDI/DPI.</text>
  </g>

  <!-- Row 2: SCEIN -->
  <g transform="translate(30, 230)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">003 EQUIPOS INDISPONIBLES</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Levantamiento TRX y Disyuntores S/E</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Libros Excel estáticos sin trazabilidad:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Equipos quemados no disparan órdenes correctivas a cuadrillas.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SCEIN-REF (Puerto 3005 / InsForge scein.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Catálogo de indisponibilidad en vivo, criticidad S/E y auditoría ISO 55000.</text>
  </g>

  <!-- Row 3: SCPPE -->
  <g transform="translate(30, 315)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">_PTRSEN &amp; Z-POA REST.</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">821 Proyectos + 24 Libros de RO</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Fichas aisladas y desvinculadas del POA:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Estimaciones en USD sin partida presupuestaria en Bolívares.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SCPPE-REF (Puerto 3004 / InsForge scppe.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Wizard POA 4 pasos, integración de 821 obras PRTSEN y árbol dim_organizaciones.</text>
  </g>

  <!-- Row 4: SCMTP -->
  <g transform="translate(30, 400)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">MINUTAS VC GGPD</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Minutas en PDF de Google Meet</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Compromisos olvidados sin fecha de corte:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">No existe seguimiento formal de asignaciones a jefes de división.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SCMTP-REF (Puerto 3003 / InsForge scmtp.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Gestor de minutas SEN, responsables asignados y semáforo de vencimiento.</text>
  </g>

  <!-- Row 5: SCGCC -->
  <g transform="translate(30, 485)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">CORRESPONDENCIA GGP</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Libro CORRELATIVO GGP.xlsx</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Oficios extraviados y firmas vulnerables:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Dependencia del papel físico y falta de acuse de recibo electrónico.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SCGCC-REF (Puerto 3006 / InsForge scgcc.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Cero Papel con Hash SHA-256 inmutable, código QR y derivación a tareas SCMTP.</text>
  </g>

  <!-- Row 6: SIGI -->
  <g transform="translate(30, 570)" filter="url(#shadow4)">
    <rect width="1140" height="78" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1" fill-opacity="0.7"/>
    <rect x="8" y="8" width="270" height="62" fill="#0f172a" rx="4"/>
    <text x="18" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">010 REGISTROS &amp; 1X10</text>
    <text x="18" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">24 Excels AP/PP/BT + PPTs diarios</text>

    <text x="298" y="32" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">Consolidación manual caótica y WhatsApp:</text>
    <text x="298" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Fórmulas rotas, doble digitación y dispersión de datos de campo.</text>

    <rect x="684" y="8" width="446" height="62" fill="#064e3b" rx="4" stroke="#059669" stroke-width="1"/>
    <text x="696" y="30" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold">SIGI-REF (Puerto 3001 / InsForge sigi.*)</text>
    <text x="696" y="48" fill="#d1fae5" font-family="sans-serif" font-size="10">Consola central con formularios web dinámicos, validación ISO 8000 y dashboards.</text>
  </g>
</svg>