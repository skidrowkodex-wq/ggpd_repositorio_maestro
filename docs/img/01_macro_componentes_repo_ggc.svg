    <text x="18" y="460" fill="#ddd6fe" font-family="sans-serif" font-size="9.5">software de trazabilidad.</text>
    <text x="18" y="476" fill="#ddd6fe" font-family="sans-serif" font-size="9.5">Oficios en papel y PDF.</text>
