    <text x="16" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Libros Excel individuales</text>

    <rect x="10" y="390" width="196" height="118" fill="#2e1065" rx="6" stroke="#7c3aed" stroke-width="1"/>
