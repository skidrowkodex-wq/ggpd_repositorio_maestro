  <text x="55" y="84" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13">RADIOGRAFÍA FORENSE DEL REPOSITORIO /repo_ggc · 1,400 ARCHIVOS · 285 DIRECTORIOS · AUDITORÍA DE PROCESOS 2026</text>
  
  <rect x="980" y="42" width="170" height="30" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1"/>
